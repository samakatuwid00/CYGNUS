# agentloop config for CYGNUS.
# Run from C:\Users\deped\agentloop:
#   PYTHONPATH=. python -m agentloop "<task>" --project C:\Users\deped\Documents\CYGNUS

[loop]
model = "claude-opus-5"
max_iterations = 5
max_cost_usd = 30.0        # per RUN, not lifetime
phase_cost_usd = 15.0      # build hit the 8.0 cap mid-work on the five-defect task
max_wall_seconds = 3600        # suite alone is ~67s, so budget room for ~5 rounds
max_verify_rounds = 2

# Loads this project's .claude/settings.local.json plus your user CLAUDE.md,
# Second Brain hooks, and skills. Also what enables the /sb and SB: prefixes.
setting_sources = ["user", "project", "local"]

# Keep CLAUDE.md and project settings, but drop the "/sb full " / "SB: "
# prompt prefixes. In an unattended session those classify the turn as a
# light/full Second Brain task, and sb-stop-guard.ps1 then refuses to let the
# phase stop until a vault record is written - which nothing in the loop does.
sb_prefixes = false

# Files the loop may read and run but never modify. A build once edited
# routing_eval.py to add a `return "multi"` branch so the gate would pass, and
# all three gates went green on the tampered evidence - only the adversarial
# verify phase caught it. The prompt already said not to; a prompt is not
# enforcement. Now a PreToolUse hook denies the write, and content hashes
# checked after every phase restore anything that slips past it.
frozen = [
  "eval/gate_routing.py",
  "eval/routing_gold.jsonl",
  "eval/stress_prompts.jsonl",
  # moved from the root into eval/ by the restructure (2026-09-22), with
  # their imports rewritten; the gate's result was unchanged
  "eval/routing_eval.py",
  "eval/stress_eval.py",
]

# Snapshot the tree whenever all gates pass, and restore the best snapshot if
# the run ends without reaching `done`, so a verify round cannot leave the loop
# worse off than a state it already reached.
checkpoint = true

# Gate 1: nothing ships that will not import.
[[gates]]
name = "compile"
command = "python -m compileall -q tests"
timeout = 120

# Gate 2: don't break anything. 861 tests, green at bca53fa and 994e70f
# (860 passed, 1 skipped, ~67s); 1082 after the 2026-09-22 restructure
# (1081 passed, 1 skipped, ~80s). Do not pipe the command - a pipe hides
# pytest's exit code and the gate would always report pass.
[[gates]]
name = "tests"
command = "python -m pytest -q"
timeout = 600

# Gate 3: did the routing defects actually get fixed. Red at 994e70f with
# 6 of 11 checks failing. Deterministic - no model call, no network - which is
# why this and not the agent_loop numbers, which swing 30 points between
# identical runs. Includes a latency ceiling so a fix cannot route a hard case
# to a model, and gold/stress floors so it cannot special-case the test set.
[[gates]]
name = "routing"
command = "python eval/gate_routing.py"
timeout = 300
