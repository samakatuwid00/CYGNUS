<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laya Playground</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1b1f24; --muted: #5d6673; --line: #dfe3e8;
  --accent: #2f6fed; --accent-soft: #e4ecfd; --ok: #1f8a4c; --ok-soft: #e2f4ea;
  --bad: #c2362b; --bad-soft: #fbe6e4; --bar: #c9d6f5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --panel: #1a1e24; --ink: #e8ebef; --muted: #98a2b0; --line: #2c323b;
    --accent: #6d9bff; --accent-soft: #1f2b44; --ok: #4cc782; --ok-soft: #173325;
    --bad: #ff7a6e; --bad-soft: #3a1c1a; --bar: #2c3f66;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 20px; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 20px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input[type=text], textarea, select { font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
input[type=text] { flex: 1 1 320px; min-width: 0; }
textarea { width: 100%; min-height: 110px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 8px; padding: 8px 14px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .55; cursor: progress; }
.tabs button.on { background: var(--accent-soft); border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 13px; padding: 5px 10px; border-radius: 999px; max-width: 100%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip small { color: var(--muted); margin-left: 6px; }
.result-head { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
.route { font-size: 26px; font-weight: 650; }
.meta { color: var(--muted); font-size: 14px; }
.verdict { font-size: 13px; padding: 3px 9px; border-radius: 999px; font-weight: 600; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.bad { background: var(--bad-soft); color: var(--bad); }
.step { margin-top: 14px; }
.step h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 6px; }
.bar { display: grid; grid-template-columns: 150px 1fr 56px; gap: 8px; align-items: center; font-size: 13px; padding: 2px 0; }
.bar .track { background: var(--bg); border-radius: 4px; height: 14px; overflow: hidden; }
.bar .fill { background: var(--bar); height: 100%; }
.bar.top .fill { background: var(--accent); }
.bar.gold .name { color: var(--ok); font-weight: 650; }
.bar .num { text-align: right; font-variant-numeric: tabular-nums; }
.scalar { font-size: 14px; }
pre { background: var(--bg); padding: 10px; border-radius: 8px; overflow: auto; font-size: 12px; max-height: 260px; }
.err { color: var(--bad); }
.hist { width: 100%; border-collapse: collapse; font-size: 13px; }
.hist td, .hist th { border-bottom: 1px solid var(--line); padding: 5px 6px; text-align: left; }
.hist td.t { max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tally { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
@media (max-width: 560px) { .bar { grid-template-columns: 100px 1fr 48px; } }
</style>
</head>
<body>
<main>
  <h1>Laya Playground</h1>
  <p class="sub" id="sub">Zero-shot CYGNUS routing with <code>convaiinnovations/laya</code>, on CPU. Loading…</p>

  <div class="panel">
    <div class="row tabs" id="tabs">
      <button data-mode="described" class="on">Routes + descriptions</button>
      <button data-mode="labels">Route names only</button>
      <button data-mode="two_stage">Two-stage</button>
      <button data-mode="custom">Custom question</button>
    </div>
    <div id="custom" hidden style="margin-top:12px">
      <div class="row">
        <select id="ctype"><option value="choice">choice</option><option value="noul">noul (yes/no)</option><option value="score">score</option></select>
        <input type="text" id="cinstr" value="Is this request destructive (deletes, kills, wipes, or cannot be undone)?">
      </div>
      <p class="meta" style="margin:8px 0 4px">Options, one per line: <code>label: description</code> (choice) or a level (score). Ignored for noul.</p>
      <textarea id="copts">yes: deletes, kills, wipes or changes something irreversibly
no: harmless or read-only</textarea>
    </div>
    <div class="row" style="margin-top:12px">
      <input type="text" id="text" placeholder="Type an utterance, e.g. open chrome then play some lofi and close spotify" autofocus>
      <button class="primary" id="go">Route</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="row" style="margin-top:8px">
      <button id="more">More gold + stress samples</button>
      <button id="morestress">Stress samples only</button>
    </div>
  </div>

  <div class="panel" id="result" hidden></div>

  <div class="panel" id="history" hidden>
    <div class="tally" id="tally"></div>
    <table class="hist"><thead><tr><th>utterance</th><th>expected</th><th>laya</th><th>conf</th><th>ms</th></tr></thead><tbody id="hbody"></tbody></table>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
let mode = "described", expected = null, meta = null;
const hist = [];

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function j(url, body) {
  const r = await fetch(url, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}

function probs(a) {
  if (a.probabilities) return Object.entries(a.probabilities);
  if (typeof a.noul === "number") return [["true", a.noul], ["false", 1 - a.noul]];
  return [];
}

function conf(a) {
  if (typeof a.confidence === "number") return a.confidence;
  const p = probs(a); return p.length ? Math.max(...p.map(x => x[1])) : null;
}

function renderStep(step) {
  const a = step.answer, p = probs(a).sort((x, y) => y[1] - x[1]);
  let html = `<div class="step"><h3>${esc(step.name)}</h3>`;
  if (a.score !== undefined) html += `<div class="scalar">score: <b>${(+a.score).toFixed(3)}</b></div>`;
  if (typeof a.noul === "number") html += `<div class="scalar">P(true): <b>${a.noul.toFixed(3)}</b></div>`;
  for (const [name, v] of p.slice(0, 12)) {
    const cls = ["bar", name === a.choice ? "top" : "", name === expected ? "gold" : ""].join(" ");
    html += `<div class="${cls}"><span class="name">${esc(name)}</span><span class="track"><span class="fill" style="width:${(v * 100).toFixed(1)}%"></span></span><span class="num">${(v * 100).toFixed(1)}%</span></div>`;
  }
  return html + `</div>`;
}

function render(text, d) {
  const last = d.steps[d.steps.length - 1].answer;
  const route = d.route ?? last.choice ?? (typeof last.noul === "number" ? (last.noul >= .5 ? "true" : "false") : last.score);
  const c = d.steps.reduce((acc, s) => acc * (conf(s.answer) ?? 1), 1);
  const top = d.steps.reduce((acc, s) => { const p = probs(s.answer); return acc * (p.length ? Math.max(...p.map(x => x[1])) : 1); }, 1);
  let verdict = "";
  if (expected && mode !== "custom") {
    const ok = route === expected;
    verdict = `<span class="verdict ${ok ? "ok" : "bad"}">${ok ? "matches" : "expected " + esc(expected)}</span>`;
    hist.unshift({text, expected, route, c, ms: d.ms, ok});
    renderHist();
  }
  $("#result").hidden = false;
  $("#result").innerHTML = `<div class="result-head"><span class="route">${esc(route)}</span>${verdict}
    <span class="meta" title="probability: the top option's share. confidence: Laya's separate gating signal - the one to threshold on.">probability ${(top * 100).toFixed(1)}% · confidence ${(c * 100).toFixed(1)}% · ${d.ms.toFixed(0)} ms on CPU</span></div>
    <div class="meta" style="margin-top:4px">“${esc(text)}”</div>
    ${d.steps.map(renderStep).join("")}
    <details style="margin-top:12px"><summary class="meta">raw answer</summary><pre>${esc(JSON.stringify(d.steps, null, 2))}</pre></details>`;
}

function renderHist() {
  $("#history").hidden = false;
  const right = hist.filter(h => h.ok).length;
  $("#tally").textContent = `Samples tried: ${hist.length} · Laya matched the label on ${right} (${(100 * right / hist.length).toFixed(0)}%)`;
  $("#hbody").innerHTML = hist.slice(0, 40).map(h =>
    `<tr><td class="t" title="${esc(h.text)}">${esc(h.text)}</td><td>${esc(h.expected)}</td>
     <td style="color:var(${h.ok ? "--ok" : "--bad"})">${esc(h.route)}</td><td>${(h.c * 100).toFixed(0)}%</td><td>${h.ms.toFixed(0)}</td></tr>`).join("");
}

function parseOpts() {
  const lines = $("#copts").value.split("\n").map(s => s.trim()).filter(Boolean);
  if ($("#ctype").value === "score") return lines;
  const o = {};
  for (const l of lines) { const i = l.indexOf(":"); i > 0 ? o[l.slice(0, i).trim()] = l.slice(i + 1).trim() : o[l] = l; }
  return o;
}

async function run() {
  const text = $("#text").value.trim();
  if (!text) return;
  $("#go").disabled = true; $("#go").textContent = "Thinking…";
  try {
    const d = mode === "custom"
      ? await j("/custom", {text, type: $("#ctype").value, instructions: $("#cinstr").value, options: parseOpts()})
      : await j("/route", {text, schema: mode});
    render(text, d);
  } catch (e) {
    $("#result").hidden = false;
    $("#result").innerHTML = `<div class="err">${esc(e.message)}</div>`;
  } finally {
    $("#go").disabled = false; $("#go").textContent = mode === "custom" ? "Ask" : "Route";
  }
}

async function loadSamples(stressOnly) {
  const rows = await j(stressOnly ? "/sample?stress" : "/sample");
  $("#chips").innerHTML = "";
  for (const r of rows) {
    const b = document.createElement("button");
    b.className = "chip";
    b.title = r.text;
    b.innerHTML = `${esc(r.text.slice(0, 60))}<small>${esc(r.set)}${r.category ? " · " + esc(r.category) : ""} → ${esc(r.gold)}</small>`;
    b.onclick = () => { $("#text").value = r.text; expected = r.gold; run(); };
    $("#chips").appendChild(b);
  }
}

$("#tabs").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  mode = b.dataset.mode;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  $("#custom").hidden = mode !== "custom";
  $("#go").textContent = mode === "custom" ? "Ask" : "Route";
};
$("#go").onclick = run;
$("#text").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
$("#text").addEventListener("input", () => { expected = null; });
$("#more").onclick = () => loadSamples(false);
$("#morestress").onclick = () => loadSamples(true);

j("/meta").then(m => {
  meta = m;
  $("#sub").textContent = `Zero-shot CYGNUS routing with convaiinnovations/laya on CPU · ${Object.keys(m.routes).length} routes · model loaded in ${m.load_s}s. Click a sample to compare Laya with the label.`;
  loadSamples(false);
}).catch(e => { $("#sub").innerHTML = `<span class="err">${esc(e.message)}</span>`; });
</script>
</body>
</html>
